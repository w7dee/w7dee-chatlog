<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Log Wizard - Photo Composer</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />

  <!-- Google Fonts (used for chat only) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Inter:wght@400;700&family=Open+Sans:wght@400;700&family=Lato:wght@400;700&family=Nunito:wght@400;700&family=Raleway:wght@400;700&family=Oswald:wght@400;700&family=Ubuntu:wght@400;700&family=Fira+Sans:wght@400;700&family=Rubik:wght@400;700&family=Source+Sans+3:wght@400;700&family=Manrope:wght@400;700&family=DM+Sans:wght@400;700&family=Work+Sans:wght@400;700&family=Barlow:wght@400;700&family=Quicksand:wght@400;700&family=Archivo:wght@400;700&family=Space+Grotesk:wght@400;700&family=Playfair+Display:wght@400;700&family=Merriweather:wght@400;700&family=Cairo:wght@400;700&family=Tajawal:wght@400;700&family=Noto+Sans+Arabic:wght@400;700&family=Noto+Kufi+Arabic:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;700&family=Almarai:wght@400;700&family=Readex+Pro:wght@400;700&family=Changa:wght@400;700&family=Amiri:wght@400;700&family=Markazi+Text:wght@400;700&family=Poppins:wght@400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="logo">
    <div class="logo-text">
      <span class="gta-yellow">W7dee's </span><span class="gta-white">Chat Wizard</span>
    </div>
    <div class="subtitle">Photo Composer (Upload image + drag/rotate chat)</div>
  </div>

  <div class="controls">
    <div class="control-group">
      <label>Font Size:</label>
      <div class="size-controls">
        <button type="button" onclick="decreaseSize()">−</button>
        <input type="text" id="sizeInput" value="13px" readonly />
        <button type="button" onclick="increaseSize()">+</button>
      </div>
    </div>

    <div class="control-group">
      <label>Line Spacing:</label>
      <div class="size-controls">
        <button type="button" onclick="decreaseSpacing()">−</button>
        <input type="text" id="spacingInput" value="Auto" readonly />
        <button type="button" onclick="increaseSpacing()">+</button>
        <button type="button" class="auto-spacing-btn" onclick="resetSpacing()">Auto</button>
      </div>
    </div>

    <div class="control-group text-style-controls">
      <label><input type="checkbox" id="boldToggle" /> <strong>Bold</strong></label>
      <label><input type="checkbox" id="italicToggle" /> <em>Italic</em></label>
    </div>

    <div class="control-group">
      <label>Font (Image Only):</label>
      <select id="fontSelect" class="font-select">
        <option value="tahoma" selected>Tahoma (Default)</option>
        <option value="roboto">Roboto</option>
        <option value="inter">Inter</option>
        <option value="opensans">Open Sans</option>
        <option value="lato">Lato</option>
        <option value="nunito">Nunito</option>
        <option value="raleway">Raleway</option>
        <option value="oswald">Oswald</option>
        <option value="ubuntu">Ubuntu</option>
        <option value="firasans">Fira Sans</option>
        <option value="rubik">Rubik</option>
        <option value="sourcesans3">Source Sans 3</option>
        <option value="manrope">Manrope</option>
        <option value="dmsans">DM Sans</option>
        <option value="worksans">Work Sans</option>
        <option value="barlow">Barlow</option>
        <option value="quicksand">Quicksand</option>
        <option value="archivo">Archivo</option>
        <option value="spacegrotesk">Space Grotesk</option>
        <option value="playfair">Playfair Display</option>
        <option value="merriweather">Merriweather</option>
        <option value="cairo">Cairo</option>
        <option value="tajawal">Tajawal</option>
        <option value="notosansarabic">Noto Sans Arabic</option>
        <option value="notokufiarabic">Noto Kufi Arabic</option>
        <option value="notonaskharabic">Noto Naskh Arabic</option>
        <option value="ibmplexarabic">IBM Plex Sans Arabic</option>
        <option value="almarai">Almarai</option>
        <option value="readexpro">Readex Pro</option>
        <option value="changa">Changa</option>
        <option value="amiri">Amiri</option>
        <option value="markazi">Markazi Text</option>
        <option value="poppins">Poppins</option>
        <option value="montserrat">Montserrat</option>
      </select>
    </div>

    <div class="control-group">
      <label>Chat BG:</label>
      <input type="color" id="colorPicker" class="color-picker" value="#000000" />
    </div>

    <div class="control-group">
      <label>Text:</label>
      <div class="color-picker-wrap">
        <input type="color" id="textColorPicker" class="color-picker" value="#ffffff" />
        <button id="saveColorBtn" class="save-in-picker" type="button">Save</button>
      </div>
    </div>

    <div class="control-group">
      <label for="strokeWidth">Stroke:</label>
      <div class="stroke-controls">
        <input type="range" id="strokeWidth" min="0" max="5" step="0.5" value="0" />
        <output id="strokeWidthValue" for="strokeWidth">0px</output>
        <input type="color" id="strokeColorPicker" class="color-picker" value="#000000" />
      </div>
    </div>

    <div class="control-group">
      <label class="bg-label">
        <input type="checkbox" id="bgToggle" checked style="width: 20px; height: 20px; cursor: pointer;" />
        Show Chat Background
      </label>
    </div>

    <div class="control-group">
      <label>Rotation:</label>
      <div class="rotation-controls">
        <button type="button" id="rotateLeft" aria-label="Rotate left">−15°</button>
        <input id="rotationRange" type="range" min="-180" max="180" step="1" value="0" />
        <button type="button" id="rotateRight" aria-label="Rotate right">+15°</button>
        <output id="rotationInput">0°</output>
      </div>
    </div>
  </div>

  <div class="helper">
    Tip: Upload a photo, drag the chat box, then use the rotation controls for precise angles.
  </div>

  <div class="upload-row">
    <input class="file-input" type="file" id="bgUpload" accept="image/*" />
    <button class="download-btn btn-filled" type="button" onclick="downloadComposite()">Download Image + Chat</button>
    <button class="download-btn btn-transparent" type="button" onclick="window.location.href='index.html'">Back to Editor</button>
  </div>

  <div class="chat-scope" id="chatScope">
    <div class="editor-box">
      <div class="line-select" id="lineSelect">
        <div class="line-select-inner" id="lineSelectInner"></div>
      </div>

      <textarea id="textInput" placeholder="Enter text here... Each original line will have 1 checkbox"></textarea>
    </div>
  </div>

  <!-- ✅ مخفي قبل رفع الصورة -->
  <div class="stage-wrap hidden" id="stageWrap">
    <div class="stage" id="stage">
      <img id="bgImg" alt="" />
      <div id="chatOverlay" aria-label="Drag to move chat">
        <div id="previewLines"></div>
      </div>
    </div>
  </div>

  <div class="contact-info">
    <p>For support and bug reports: <strong>w7dee</strong> on Discord</p>
    <p class="credit">Developed by: W7dee</p>
  </div>

  <script src="compose.js"></script>
</body>
</html>
